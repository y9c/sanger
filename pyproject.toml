[project]
name = "sanger"
version = "0.1.2"
description = "Sanger sequencing toolkit"
authors = [{ name = "Ye Chang", email = "yech1990@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["DNA", "mutation", "chromatogram", "biology"]
dependencies = [
    "click>=8.0.0,<9",
 "rich-click>=1.8.0,<2",
 "numpy>=2.3.3,<3",
]

[project.optional-dependencies]
# plotting (importing/using sanger works without it)
plot = [
    "matplotlib>=3.9.2,<4",
]
# DNA Features Viewer integration for combined feature maps
viewer = [
    "dna-features-viewer>=3.0.0",
]
# Model Context Protocol server so agents/LLMs can drive sanger
agent = [
    "mcp>=2",
]
# everything
all = [
    "matplotlib>=3.9.2,<4",
    "dna-features-viewer>=3.0.0",
    "mcp>=2",
]

[project.urls]
Repository = "https://github.com/y9c/sanger"

[project.scripts]
sanger = "sanger.cli:cli"
sanger-mcp = "sanger.mcp_server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sanger*"]

[tool.setuptools.package-data]
sanger = ["_swalign.pyx", "_swalign.c"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
build-platforms = ["linux"]
# verify the built wheel imports (the C extension should be present)
test-command = "python -c \"import sanger; from sanger.align import _HAVE_CY; print('wheel import ok', _HAVE_CY)\""

[tool.black]
line-length = 79

[tool.ruff]
line-length = 88
exclude = ["sanger/_swalign.c"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sanger"]


[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
