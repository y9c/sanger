[project]
name = "cfutils"
version = "0.0.0.dev62"
description = "Chromatogram File Utils"
authors = [{ name = "Ye Chang", email = "yech1990@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["DNA", "mutation", "chromatogram", "biology"]
dependencies = [
    "click>=8.0.0,<9",
 "rich-click>=1.8.0,<2",
 "numpy>=2.3.3,<3",
]

[project.optional-dependencies]
# C-accelerated alignment (a pure-Python/NumPy fallback is always available)
align = [
    "ssw>=0.4.1,<0.5",
]
# plotting (importing/using cfutils works without it)
plot = [
    "matplotlib>=3.9.2,<4",
]
# DNA Features Viewer integration for combined feature maps
viewer = [
    "dna-features-viewer>=3.0.0",
]
# everything
all = [
    "ssw>=0.4.1,<0.5",
    "matplotlib>=3.9.2,<4",
    "dna-features-viewer>=3.0.0",
]

[project.urls]
Repository = "https://github.com/yech1990/cfutils"
Documentation = "https://cf.readthedocs.io/"

[project.scripts]
cfutils = "cfutils.cli:cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfutils*"]

[[tool.setuptools.ext-modules]]
name = "cfutils._swalign"
sources = ["cfutils/_swalign.c"]

[tool.setuptools.package-data]
cfutils = ["_swalign.pyx", "_swalign.c"]

[tool.black]
line-length = 79

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
