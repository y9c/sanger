name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + manylinux wheels
        run: |
          pip install build cibuildwheel
          # source distribution (platform-independent; optional C ext built
          # opportunistically at install time)
          python -m build --sdist --outdir dist
          # manylinux wheels for CPython 3.11-3.14 (Linux, x86_64)
          cibuildwheel --platform linux --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    # must match the Environment name you enter on the PyPI form
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (no API token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
