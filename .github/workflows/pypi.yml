name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          pip install build cibuildwheel
      - name: Build sdist (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # source distribution (platform-independent; optional C ext built
          # opportunistically at install time)
          python -m build --sdist --outdir dist
      - name: Build wheels
        run: |
          # manylinux / musllinux on Linux; macosx arm64 + x86_64 on macOS
          cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    # must match the Environment name you enter on the PyPI form
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (no API token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
